[theme]
# Base only — actual colors are driven by src/ui/css.py, which switches
# tokens based on st.session_state.theme (Dark / Light radio in sidebar).
# Keep these neutral so they don't override the runtime theme.
base = "light"
primaryColor = "#E11D48"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F0EC"
textColor = "#161629"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
enableStaticServing = true
runOnSave = false
allowRunOnSave = false
# Deployment optimization
baseUrlPath = ""
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
# Deployment stability
enforceSerializableSessionState = false
postScriptGC = true

[global]
developmentMode = false
showWarningOnDirectExecution = false

[logger]
level = "warning"

[client]
toolbarMode = "minimal"