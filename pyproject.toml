# Dependencies live in requirements.txt (what Streamlit Community Cloud installs).
# This file only configures the dev tooling.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness-only baseline; the codebase predates linting so style rules are off.
select = ["F", "E9"]
ignore = ["F401", "F403", "F541", "F841"]
